<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kart · Online Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="#">Kart</a>
    <input id="search" type="search" placeholder="Search products" aria-label="Search products">
    <button id="theme" class="ghost" aria-label="Toggle dark mode">◐</button>
    <button id="cart-btn" style="margin-left:0" class="cart-btn" aria-label="Open cart">Cart <span id="badge" class="badge">0</span></button>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Everything you need, in one cart.</h1>
      <p>Free shipping over $100. Use code <b>SAVE10</b> for 10% off.</p>
      <div class="row2"><button id="hero-btn" class="primary">Shop top rated</button><span id="count" aria-live="polite"></span></div>
    </section>
    <div class="controls">
      <div id="cats" class="chips" aria-label="Categories"></div>
      <label class="pf">Max price <input id="max" type="range" min="10" max="1000" step="10" value="1000"><b id="max-v">Any</b></label>
      <select id="sort" aria-label="Sort products">
        <option value="featured">Featured</option><option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option><option value="rating">Top rated</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="d-head"><h2>Your cart</h2><button id="close" class="x" aria-label="Close cart">✕</button></div>
    <p id="ship" class="ship"></p>
    <ul id="items" class="items"></ul>
    <div class="d-foot">
      <form id="coupon" class="coupon"><input id="code" placeholder="Coupon (try SAVE10)" aria-label="Coupon code"><button>Apply</button></form>
      <dl id="totals" class="totals"></dl>
      <button id="checkout" class="primary">Checkout</button>
    </div>
  </aside>

  <dialog id="modal">
    <form id="order" method="dialog" class="order">
      <h2>Checkout</h2>
      <p class="muted">Simulated checkout. No payment is taken.</p>
      <label>Full name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Shipping address<textarea name="addr" rows="2" required></textarea></label>
      <p id="o-total" class="o-total"></p>
      <div class="row"><button type="button" id="o-cancel" class="ghost">Back</button><button class="primary">Place order</button></div>
    </form>
    <div id="done" class="order" hidden>
      <div class="tick">✓</div><h2>Order confirmed</h2>
      <p id="done-msg" class="muted"></p><button id="done-ok" class="primary">Keep shopping</button>
    </div>
  </dialog>
  <dialog id="qv"><div id="qv-body" class="order"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="script.js"></script>
</body>
</html>
